<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu KPI Cá nhân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 900px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .table-responsive { margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center text-primary mb-4">HỆ THỐNG TRA CỨU TRỌNG SỐ & KPI</h2>
    
    <div class="row mb-3">
        <div class="col-md-8">
            <input type="text" id="emailInput" class="form-control" placeholder="Nhập Email của bạn (VD: anhnt110)">
        </div>
        <div class="col-md-4">
            <button class="btn btn-primary w-100" onclick="tinhKPI()">Tra cứu KPI</button>
        </div>
    </div>

    <div id="loading" class="text-center text-secondary d-none">Đang tải dữ liệu...</div>
    <div id="errorMsg" class="text-danger mt-2"></div>

    <div class="table-responsive">
        <table class="table table-bordered table-striped" id="resultTable" style="display: none;">
            <thead class="table-dark">
                <tr>
                    <th>Chỉ tiêu (Cấp 3)</th>
                    <th>Trọng số Cấp 1</th>
                    <th>Trọng số Cấp 2</th>
                    <th>Trọng số Cấp 3</th>
                    <th>Trọng số Chi tiết (Tổng)</th>
                    <th>KPI Giao</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    // Định nghĩa cấu trúc chỉ tiêu (Sửa/Thêm các chỉ tiêu của bạn vào đây)
    const mapping = {
        'Thu_ly_SEC': ['To_tung_SEC', '1_To_tung'],
        'Tham_dinh_SEC': ['To_tung_SEC', '1_To_tung'],
        'Ban_an_SEC': ['To_tung_SEC', '1_To_tung'],
        'QD_THA_SEC': ['To_tung_SEC', '1_To_tung'],
        'Ke_bien_SEC': ['To_tung_SEC', '1_To_tung'],
        'Thu_ly_UNS': ['To_tung_UNS', '1_To_tung'],
        'Ban_an_UNS': ['To_tung_UNS', '1_To_tung'],
        'QD_THA_UNS': ['To_tung_UNS', '1_To_tung'],
        'BB_SEC_non_WO': ['So_thu_SEC', '2_So_thu'],
        'BB_SEC_WO': ['So_thu_SEC', '2_So_thu'],
        'GB_All': ['So_thu_SEC', '2_So_thu'],
        'BB_UNS': ['So_thu_UNS', '2_So_thu'],
        'Thu_Giu': ['So_thu_UNS', '2_So_thu']
    };

    let allData = [];

    // Tự động tải file data.csv khi mở trang web
    window.onload = function() {
        document.getElementById('loading').classList.remove('d-none');
        Papa.parse("data.csv", {
            download: true,
            header: true,
            complete: function(results) {
                allData = results.data;
                document.getElementById('loading').classList.add('d-none');
            },
            error: function() {
                document.getElementById('errorMsg').innerText = "Không thể tải file data.csv. Hãy chắc chắn file đang nằm cùng thư mục.";
                document.getElementById('loading').classList.add('d-none');
            }
        });
    }

    function tinhKPI() {
        const email = document.getElementById('emailInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultTable = document.getElementById('resultTable');
        const tableBody = document.getElementById('tableBody');
        
        errorMsg.innerText = "";
        tableBody.innerHTML = "";
        resultTable.style.display = "none";

        if(!email) {
            errorMsg.innerText = "Vui lòng nhập email!";
            return;
        }

        if(allData.length === 0) {
            errorMsg.innerText = "Dữ liệu chưa tải xong, vui lòng thử lại sau vài giây.";
            return;
        }

        // Lọc dữ liệu của user đang tìm
        const userDataArray = allData.filter(row => row['EMAIL_USER'] === email);
        
        if(userDataArray.length === 0) {
            errorMsg.innerText = "Không tìm thấy dữ liệu cho nhân viên này!";
            return;
        }

        // Chuyển mảng dữ liệu thành Object để dễ tra cứu: { '1_To_tung': { TRONG_SO: 0.5, CHI_TIEU: 0 }, ... }
        let userDict = {};
        userDataArray.forEach(row => {
            let kpiCode = row['TEN_CHI_TIEU_CODE'];
            if(kpiCode) {
                userDict[kpiCode.trim()] = {
                    trongSo: parseFloat(row['TRONG_SO_CHITIEU']) || 0,
                    kpiGiao: parseFloat(row['CHI_TIEU_THANG']) || 0
                };
            }
        });

        let hasData = false;

        // Bắt đầu tính toán dựa trên mapping
        for (const [chiTieuCap3, parents] of Object.entries(mapping)) {
            if (userDict[chiTieuCap3]) {
                hasData = true;
                const cap2 = parents[0];
                const cap1 = parents[1];

                const tsCap1 = userDict[cap1] ? userDict[cap1].trongSo : 0;
                const tsCap2 = userDict[cap2] ? userDict[cap2].trongSo : 0;
                const tsCap3 = userDict[chiTieuCap3].trongSo;
                const kpiGiao = userDict[chiTieuCap3].kpiGiao;

                const trongSoTong = tsCap1 * tsCap2 * tsCap3;

                // Tạo dòng mới trong bảng HTML
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-primary fw-bold">${chiTieuCap3}</td>
                    <td>${(tsCap1 * 100).toFixed(2)}%</td>
                    <td>${(tsCap2 * 100).toFixed(2)}%</td>
                    <td>${(tsCap3 * 100).toFixed(2)}%</td>
                    <td class="text-danger fw-bold">${(trongSoTong * 100).toFixed(2)}%</td>
                    <td class="text-success fw-bold">${kpiGiao.toLocaleString()}</td>
                `;
                tableBody.appendChild(tr);
            }
        }

        if(hasData) {
            resultTable.style.display = "table";
        } else {
            errorMsg.innerText = "Nhân sự này không có chỉ tiêu chi tiết nào trong hệ thống.";
        }
    }
</script>
</body>
</html>
